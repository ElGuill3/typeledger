<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="case-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77767b"/>
      <stop offset="1" stop-color="#5e5c64"/>
    </linearGradient>
    <linearGradient id="cap-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
    <linearGradient id="accent-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa348"/>
      <stop offset="1" stop-color="#ff7800"/>
    </linearGradient>
    <g id="key">
      <rect y="2" width="9.5" height="9.5" rx="2.5" fill="#9a9996"/>
      <rect width="9.5" height="9.5" rx="2.5" fill="url(#cap-top)"/>
    </g>
    <g id="accent-key">
      <rect y="2" width="9.5" height="9.5" rx="2.5" fill="#c64600"/>
      <rect width="9.5" height="9.5" rx="2.5" fill="url(#accent-top)"/>
    </g>
    <!-- Left half: four staggered columns, three rows and two thumb keys. -->
    <g id="half">
      <rect y="5" width="52" height="50" rx="8" fill="#3d3846"/>
      <rect x="22" y="25" width="30" height="40" rx="8" fill="#3d3846"/>
      <rect width="52" height="50" rx="8" fill="url(#case-top)"/>
      <rect x="22" y="20" width="30" height="40" rx="8" fill="url(#case-top)"/>
      <use xlink:href="#key" x="4" y="9"/>
      <use xlink:href="#key" x="16" y="6"/>
      <use xlink:href="#key" x="28" y="4"/>
      <use xlink:href="#key" x="40" y="6"/>
      <use xlink:href="#key" x="4" y="21"/>
      <use xlink:href="#key" x="16" y="18"/>
      <use xlink:href="#key" x="28" y="16"/>
      <use xlink:href="#accent-key" x="40" y="18"/>
      <use xlink:href="#key" x="4" y="33"/>
      <use xlink:href="#key" x="16" y="30"/>
      <use xlink:href="#key" x="28" y="28"/>
      <use xlink:href="#key" x="40" y="30"/>
      <use xlink:href="#key" x="26" y="45"/>
      <use xlink:href="#key" x="38" y="45"/>
    </g>
    <g id="left">
      <use xlink:href="#half" transform="translate(3 25) scale(1.08) rotate(7 26 32)"/>
    </g>
  </defs>
  <use xlink:href="#left"/>
  <use xlink:href="#left" transform="matrix(-1 0 0 1 128 0)"/>
</svg>
